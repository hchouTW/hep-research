# tests: the hep-research test suite (T13). Runs on pushes to main, on pull requests, and weekly against the latest
# releases. Branch pushes are tested through their pull request only, so each PR commit runs once, not twice.
#   plan       the CI plan (tools/ci_plan.py): on a pull request, the test modules and parts its changed files need, from
#              the impact map in contracts/rules/registry.json; anything it cannot bound (a file outside the plugin, CI
#              tooling, a path no impact group covers) is the full run. Pushes to main, weekly and manual runs are full
#   checks     unit tests (fast tier), profile suites and the static checks, on Python 3.13 (the supported floor) with the
#              pinned set (plugins/hep-research/requirements-ci.lock); required. The Python version runs as five
#              parallel jobs: the test modules in three shards balanced by tools/module_timings.json, the profile
#              suites with the static checks, and the AMS-optionality check (run_all_checks.py --part / --shard);
#              every module is in one shard. Each job writes failures and timings to the job summary. On a pull request
#              each job runs what the plan selects (the AMS-optionality job: the selected modules of its suites); a job
#              with nothing selected skips installing and still writes its record.
#   checks-complete  reconciles the check-run records of all checks jobs (tools/reconcile_check_runs.py): every
#              expected run present once, of this commit, passing, and the shards partition the selected modules (it
#              recomputes the plan rather than trusting the plan job's copy; every run must name that plan); it
#              runs even when a checks job failed and fails when a record is missing; required
#   lint       ruff and mypy on core/ and contracts/; required
#   stats-backends  the statistics tests with pyhf 0.7.6 and ArviZ 0.23.4 required, and NumPy and hypothesis from the
#              lock (the sci-fix eigenvalue oracle and the property tests): a skip for any of them fails; required
#   bdt-backend  the BDT tests (train_bdt.py, export_bdt.py, the analysis-to-paper BDT path) with xgboost 3.4.1 and
#              scikit-learn 1.9.1 required: a skip for either fails; required
#   simreco    Geant4 program B2.9: simreco (C++17, no Geant4) built with the runner's compiler and its tests
#              (tests.adapters.test_simreco) run with HEP_SIMRECO_REQUIRED=1, so a skip for a missing compiler fails;
#              required
#   optional-* the unit tests with pyhf, uproot + awkward, hepdata_lib + hepdata-validator, PyTorch (CPU) or ROOT; they may fail without
#              blocking a merge for now, but their results are shown on the run. On pull requests each runs only the
#              modules its extra unlocks (run_all_checks.py --extra, tools/optional_modules.json); pushes to main,
#              weekly and manual runs keep the full suite, and optional-selection verifies the list against them
#   release-manifests  published release bundles unchanged (C10); required
#   hostile-paths  TMPDIR and the working directory reached through symlinks, in a folder whose name has a space and
#              Chinese characters; a test tree with an NFD-named file, .DS_Store and an AppleDouble file through
#              tools/check_packaging.py. Pull requests: tests/contracts, tests/core (protected, partition, blinding),
#              tests/tools and tools/check_relocation.py, skipped when the plan selects none of those modules; pushes
#              to main, weekly and manual runs: the full units part (record platform-run-hostile-paths)
#   old-python a real Python 3.9 as `python3` first on PATH: every skill script stops or switches as the interpreter
#              guard says (tools/platform_checks.py old-python: AC2-AC4, the root case through sudo), and the real
#              3.9 byte-compiles every skill script (tests/tools/test_python_compat.py)
#   latest     weekly and on demand: the latest releases (no lock) and the slow tier (HEP_SLOW_TESTS=1), with a
#              1800 s module limit (HEP_MODULE_TIMEOUT): the slowest slow-tier module takes about 545 s alone
# Actions are pinned to commit SHAs; the comment names the release. pip downloads are cached (setup-python, keyed on
# the lock file); a cache hit only saves downloads: the pinned set is installed and every test runs on every run.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels that PR's older, superseded run: only the newest revision can be merged, and a
# cancelled run never passes (checks-complete stays cancelled). Pushes to main, the weekly run and manual runs are
# never cancelled (each has its own group: the ref plus the run id).
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: plugins/hep-research

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # a pull request checks out its merge commit: HEAD^1 is the base it merges onto
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Plan the checks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/ci_plan.py plan --base HEAD^1 --out ../../ci-plan/plan.json
          else
            python tools/ci_plan.py plan --full "$EVENT run" --out ../../ci-plan/plan.json
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("../../ci-plan/plan.json"))
          print("### CI plan: " + ("full run" if p["full"] else f"{len(p['modules'])} test modules, parts {p['parts'] or 'none'}"))
          print("")
          print("\n".join(f"- {r}" for r in p["reasons"]))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-plan
          path: ci-plan/

  checks:
    name: checks (Python ${{ matrix.python }}, ${{ matrix.part.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        part:
          - {name: "units 1/3", key: units-1, args: "--part units --shard 1/3", sel: "--part units --shard 1/3"}
          - {name: "units 2/3", key: units-2, args: "--part units --shard 2/3", sel: "--part units --shard 2/3"}
          - {name: "units 3/3", key: units-3, args: "--part units --shard 3/3", sel: "--part units --shard 3/3"}
          - {name: "static and profiles", key: static, args: "--part static", sel: "--part static"}
          - {name: "AMS optional", key: ams-optional, args: "--part ams-optional", sel: "--part ams-optional"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ci-plan
          path: ci-plan
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip  # downloaded wheels only, keyed on the lock; every install and test still runs
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Does the plan select anything for this job?
        id: sel
        run: echo "run=$(python tools/ci_plan.py selects ../../ci-plan/plan.json ${{ matrix.part.sel }})" >> "$GITHUB_OUTPUT"
      - name: Install the pinned set
        if: steps.sel.outputs.run == 'true'
        run: python -m pip install -r requirements-ci.lock
      - name: ${{ matrix.part.name }}
        run: python tools/run_all_checks.py --no-cli --jobs 4 ${{ matrix.part.args }} --plan ../../ci-plan/plan.json --out ../../check-runs --summary "$GITHUB_STEP_SUMMARY"
      - name: Tool-contract scopes (every scoped operation has a passing contract, task P5.4)
        if: matrix.part.key == 'static' && steps.sel.outputs.run == 'true'
        run: for s in contracts/tool_scopes/*.json; do python contracts/tool_contract.py --scope "$s" > /dev/null || exit 1; done
      - name: Routing-harness tests (fake CLI, no model calls)
        if: matrix.part.key == 'static' && steps.sel.outputs.run == 'true'
        working-directory: .
        run: python -m unittest discover -s evals/routing/tests -t evals/routing/tests
      - name: Research-communication replay-scorer tests (no model calls)
        if: matrix.part.key == 'static' && steps.sel.outputs.run == 'true'
        working-directory: .
        run: python -m unittest discover -s evals/research_communication/tests -t evals/research_communication/tests
      - name: Behavioral-harness tests, case validation and invariant coverage (fake host, no model calls)
        if: matrix.part.key == 'static' && steps.sel.outputs.run == 'true'
        working-directory: .
        run: |
          python -m unittest discover -s evals/behavior/tests -t evals/behavior/tests
          python evals/behavior/run.py validate
          python evals/behavior/run.py coverage
      - name: Keep the check-run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: check-run-py${{ matrix.python }}-${{ matrix.part.key }}
          path: check-runs/

  checks-complete:
    # The gate over the checks matrix: a missing, duplicated, failed or foreign record fails it, and so does a module
    # that no shard ran; equal test counts are not evidence. It runs after a failed checks job too (always()), and a
    # cancelled run leaves it cancelled, never passing.
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: check-run-py*
          path: check-runs
      - name: Recompute the CI plan (the gate does not trust the plan job's copy)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/ci_plan.py plan --base HEAD^1 --out ../../gate-plan/plan.json > /dev/null
          else
            python tools/ci_plan.py plan --full "$EVENT run" --out ../../gate-plan/plan.json > /dev/null
          fi
      - name: Reconcile the check-run records
        run: python tools/reconcile_check_runs.py ../../check-runs --python 3.13 --shards 3 --parts static,ams-optional --plan ../../gate-plan/plan.json --sha "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

  stats-backends:
    # hep-statistics audit (CI gate 1): the backends the statistics tests promise (pyhf 0.7.6, ArviZ 0.23.4; NumPy and
    # hypothesis for sci-fix evidence, docs/maintenance.md) are required here; a test skipped for a missing one fails the job instead of passing silently
    # (tools/run_required_backends.py). Required.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set with pyhf and ArviZ
        run: python -m pip install -r requirements-ci.lock "pyhf==0.7.6" "arviz==0.23.4"
      - name: Statistics and backend tests, no skip allowed for a required backend
        run: |
          mkdir -p ../../check-runs
          python tools/run_required_backends.py --require pyhf==0.7.6,arviz==0.23.4,numpy,hypothesis --out ../../check-runs/required-backends.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: required-backends
          path: check-runs/

  pdg-cross-check:
    # sci-fix TH9-MASSES: the bundled PDG 2026 masses against the pdg package (2026 edition). The test skips without
    # the package or with another edition; here a skip naming pdg fails the job (tools/run_required_backends.py).
    # Required.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set with pdg 2026.0
        run: python -m pip install -r requirements-ci.lock "pdg==2026.0" "SQLAlchemy==2.1.5" "typing_extensions==4.16.0"
      - name: Constants tests, no skip allowed for pdg
        run: |
          mkdir -p ../../check-runs
          python tools/run_required_backends.py --require pdg==2026.0 --modules tests.core.test_constants --out ../../check-runs/pdg-cross-check.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pdg-cross-check
          path: check-runs/

  simreco:
    # Geant4 program B2.9: simreco (adapters/geant4/assets/simreco/, C++17, no Geant4) is built with the system C++
    # compiler (-ffp-contract=off) by tests/adapters/test_simreco.py, which then runs the fitter, determinism, summary,
    # tail-source and reco/table plumbing tests; HEP_SIMRECO_REQUIRED=1 turns the no-compiler skip into a failure.
    # Required. The macOS (libc++) build is recorded locally (VALIDATION GEANT4-F4).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set
        run: python -m pip install -r requirements-ci.lock
      - name: Build and test simreco, no skip allowed
        env:
          HEP_SIMRECO_REQUIRED: "1"
        run: |
          c++ --version
          python -m unittest -v tests.adapters.test_simreco

  torch-backend:
    # The hep-ml modules with PyTorch tests (sci-fix ML-DOMAIN among them) run with a pinned torch; a test skipped for
    # PyTorch fails the job (tools/run_required_backends.py), except the clean-degradation tests meant for its absence,
    # which the jobs without torch run. Required. The unpinned optional (torch-cpu) job stays as an early warning for
    # new PyTorch releases; bump the pins here when it passes on a newer one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set with torch 2.14.1 (CPU)
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install "torch==2.14.1" "torchvision==0.29.1" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: PyTorch tests, no skip allowed for torch
        run: |
          mkdir -p ../../check-runs
          python tools/run_required_backends.py --require torch==2.14.1,torchvision==0.29.1 \
            --allow-skip-reason "only meaningful when PyTorch is not installed" \
            --modules tests.skills.hep_ml.test_assets_smoke,tests.skills.hep_ml.test_audit_domain_method,tests.skills.hep_ml.test_audit_metric_layer,tests.skills.hep_ml.test_audit_small_corrections,tests.skills.hep_ml.test_audit_train_keys,tests.skills.hep_ml.test_hep_losses,tests.skills.hep_ml.test_hep_ml_skill,tests.skills.hep_ml.test_set_classifier,tests.skills.hep_ml.test_training_pipeline \
            --out ../../check-runs/torch-backend.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: torch-backend
          path: check-runs/

  bdt-backend:
    # The BDT tests (skills/hep-ml/scripts/train_bdt.py and export_bdt.py, and the --with-bdt path of the
    # analysis-to-paper example) run with the `bdt` extra pinned; a test skipped for xgboost or scikit-learn (sklearn)
    # fails the job (tools/run_required_backends.py). Required. tests/tools/test_pyproject.py checks that every module
    # with such a test is listed. Bump the pins together with the `bdt` extra in pyproject.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set with xgboost 3.4.1 and scikit-learn 1.9.1
        run: python -m pip install -r requirements-ci.lock "xgboost==3.4.1" "scikit-learn==1.9.1" "joblib==1.6.0" "narwhals==2.27.1" "threadpoolctl==3.7.0"
      - name: BDT tests, no skip allowed for xgboost or scikit-learn
        run: |
          mkdir -p ../../check-runs
          python tools/run_required_backends.py --require xgboost==3.4.1,sklearn==1.9.1 \
            --modules tests.examples.test_analysis_to_paper,tests.skills.hep_ml.test_train_bdt,tests.skills.hep_ml.test_train_bdt_extensions \
            --out ../../check-runs/bdt-backend.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bdt-backend
          path: check-runs/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff and mypy
        run: python -m pip install "ruff==0.16.10" "mypy==2.4.0" -r requirements-ci.lock
      - name: ruff
        run: ruff check core contracts
      - name: mypy
        run: mypy
      - name: shellcheck (the plugin's shell scripts)
        run: shellcheck adapters/environments/assets/lcg_view_setup.sh skills/hep-computing/scripts/check_root_cpp_env.sh skills/hep-computing/scripts/new_root_cpp_project.sh

  release-manifests:
    # C10: a published release bundle never changes. Each recorded manifest (release-manifests/<version>.json) must
    # match the bundle exported from tag hep-research--v<version>, and recorded manifests are append-only. The
    # Unreleased working tree is not checked.
    name: published releases unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Recorded release manifests match their tags and are append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python tools/release_manifest.py check-published --base "$BASE"
          else
            python tools/release_manifest.py check-published
          fi

  optional-python:
    name: optional (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pyhf
            install: "'pyhf>=0.7.6,<0.8'"
          - extra: root-uproot
            install: "'uproot>=5.7,<6' 'awkward>=2.14,<3' 'PyYAML>=6'"
          - extra: columnar
            install: "'coffea>=2026.9' 'pyarrow>=20' 'uproot>=5.7,<6' 'awkward>=2.14,<3'"
          - extra: hepdata
            install: "hepdata_lib hepdata-validator PyYAML"
          - extra: torch-cpu
            install: "torch torchvision --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set and ${{ matrix.extra }}
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip install ${{ matrix.install }}
      - name: Unit tests with ${{ matrix.extra }} available
        # pull requests: only the modules with tests this extra unlocks (tools/optional_modules.json); main and weekly: all
        run: python tools/run_all_checks.py --part units --no-cli --jobs 4 ${{ github.event_name == 'pull_request' && format('--extra {0}', matrix.extra) || '' }} --out ../../check-runs --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the check-run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: check-run-optional-${{ matrix.extra }}
          path: check-runs/

  optional-root:
    name: optional (ROOT)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    container: rootproject/root:6.38.00-ubuntu25.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the pinned set next to ROOT
        run: |
          apt-get update -qq && apt-get install -y -qq python3-pip
          python3 -m pip install --break-system-packages --ignore-installed -r requirements-ci.lock
      - name: Unit tests with PyROOT available
        run: |
          if command -v git >/dev/null; then git config --global --add safe.directory "$GITHUB_WORKSPACE"; fi  # checkout owned by another user
          python3 -c "import ROOT; print('ROOT', ROOT.gROOT.GetVersion())"
          python3 tools/run_all_checks.py --part units --no-cli --jobs 4 ${{ github.event_name == 'pull_request' && '--extra ROOT' || '' }} --out ../../check-runs --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the check-run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: check-run-optional-ROOT
          path: check-runs/

  optional-selection:
    # Pushes to main, the weekly and manual runs: the full optional runs show which modules each extra unlocks
    # (tests the required shards skip); tools/optional_selection.py verify fails when one of them is not listed in
    # tools/optional_modules.json, which pull requests use to run the optional jobs selectively.
    needs: [checks, optional-python, optional-root]
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: check-run-*
          path: check-runs
      - name: Verify the optional-module selection
        run: |
          opt=""
          for d in ../../check-runs/check-run-optional-*; do opt="$opt ${d##*check-run-optional-}=$d"; done
          python tools/optional_selection.py verify --required ../../check-runs/check-run-py3.13-units-* --optional $opt

  hostile-paths:
    # Paths with a space, Chinese characters and symlinks (TMPDIR and the working directory), plus a tree with an
    # NFD-named file, .DS_Store and an AppleDouble file for the packaging scan. Its record uses the prefix
    # platform-run- (never check-run-, which the checks gate collects) and is reconciled here.
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ci-plan
          path: ci-plan
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: What does this run cover?
        id: sel
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - "$EVENT" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          if sys.argv[1] != "pull_request":
              print("scope=full")
              raise SystemExit
          plan = json.load(open("../../ci-plan/plan.json"))
          prefixes = ("tests.contracts.", "tests.tools.", "tests.core.test_partition", "tests.core.test_blinding",
                      "tests.core.test_r5")
          hit = plan["full"] or any(m.startswith(prefixes) for m in plan["modules"])
          print("scope=subset" if hit else "scope=none")
          PY
      - name: Install the pinned set
        if: steps.sel.outputs.scope != 'none'
        run: python -m pip install -r requirements-ci.lock
      - name: Build the hostile folders (space, Chinese characters, symlinks)
        if: steps.sel.outputs.scope != 'none'
        run: |
          H="$RUNNER_TEMP/hep 測試 paths"
          mkdir -p "$H/real-tmp" "$H/real-work"
          cp -a "$GITHUB_WORKSPACE/." "$H/real-work/"
          ln -s "$H/real-work" "$H/work"
          ln -s "$H/real-tmp" "$H/tmp"
          echo "HOSTILE=$H" >> "$GITHUB_ENV"
      - name: Packaging scan of a tree with an NFD name, .DS_Store and an AppleDouble file
        if: steps.sel.outputs.scope != 'none'
        working-directory: ${{ runner.temp }}
        run: |
          T="$HOSTILE/tree"
          mkdir -p "$T"
          git -C "$GITHUB_WORKSPACE" archive HEAD plugins/hep-research | tar -x -C "$T"
          P="$T/plugins/hep-research"
          python - "$P" <<'PY'
          import sys, unicodedata
          from pathlib import Path
          p = Path(sys.argv[1])
          (p / "docs" / unicodedata.normalize("NFD", "café-測試.md")).write_text("NFD-named file\n", encoding="utf-8")
          (p / "docs" / ".DS_Store").write_bytes(b"\x00\x00\x00\x01Bud1")
          (p / "docs" / "._architecture.md").write_bytes(b"\x00\x05\x16\x07\x00\x02\x00\x00Mac OS X        ")
          PY
          git -C "$P" init -q && git -C "$P" add -A
          set +e
          python "$GITHUB_WORKSPACE/plugins/hep-research/tools/check_packaging.py" --root "$P" > "$HOSTILE/packaging.json"
          code=$?
          set -e
          python - "$HOSTILE/packaging.json" "$code" <<'PY'
          import json, sys
          rep, code = json.load(open(sys.argv[1], encoding="utf-8")), int(sys.argv[2])
          rules = {(f["file"].rsplit("/", 1)[-1], f["rule"]) for f in rep["findings"]}
          expected = {(".DS_Store", "cache"), ("._architecture.md", "appledouble")}
          extra = [f for f in rep["findings"] if (f["file"].rsplit("/", 1)[-1], f["rule"]) not in expected
                   and f["rule"] != "size-statement-drift"]
          print(json.dumps({"exit": code, "findings": rep["findings"]}, ensure_ascii=False, indent=1))
          assert code == 1 and expected <= rules and not extra, "the scan must flag exactly .DS_Store and the AppleDouble file"
          PY
      - name: Tests in the hostile folder (pull request subset)
        if: steps.sel.outputs.scope == 'subset'
        working-directory: ${{ runner.temp }}
        run: |
          cd "$HOSTILE/work/plugins/hep-research"
          export TMPDIR="$HOSTILE/tmp"
          python -m unittest discover -s tests/contracts -t .
          python -m unittest discover -s tests/tools -t .
          # protected mode is tested in tests/contracts and test_partition_protected_batch (no tests/core/test_protected*)
          for p in "test_partition*.py" "test_blinding*.py" "test_r5*.py"; do
            python -m unittest discover -s tests/core -t . -p "$p"
          done
          python tools/check_relocation.py
      - name: Units part in the hostile folder (main, weekly, manual)
        if: steps.sel.outputs.scope == 'full'
        working-directory: ${{ runner.temp }}
        run: |
          cd "$HOSTILE/work/plugins/hep-research"
          export TMPDIR="$HOSTILE/tmp"
          python tools/run_all_checks.py --no-cli --jobs 4 --part units --shard 1/1 --out "$GITHUB_WORKSPACE/platform-runs" --summary "$GITHUB_STEP_SUMMARY"
          python tools/check_relocation.py
      - name: Reconcile the record
        if: steps.sel.outputs.scope == 'full'
        run: python tools/reconcile_check_runs.py ../../platform-runs --python 3.13 --shards 1 --parts "" --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        if: always() && steps.sel.outputs.scope == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: platform-run-hostile-paths
          path: platform-runs/

  old-python:
    # A real CPython 3.9 (end of life; no macOS arm64 or Windows build in actions/python-versions) as `python3`:
    # the interpreter guard of every skill script (AC2-AC4) and a real 3.9 byte-compile of every skill script.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py39
        with:
          python-version: "3.9"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py313
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/hep-research/requirements-ci.lock
      - name: Install the pinned set
        run: python -m pip install -r requirements-ci.lock
      - name: Interpreters for the guard cases
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/rw"
          ln -s "$PY39" "$RUNNER_TEMP/bin/python3"
          ln -s "$PY39" "$RUNNER_TEMP/bin/python3.9"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # a 3.13 the runner account cannot write (root-owned copy), a read-only wrapper that launches 3.9, and a
          # 3.13 in a writable folder
          sudo cp -a "$(dirname "$(dirname "$PY313")")" /opt/hep-ro-py313  # the whole install, with the pinned set
          sudo chown -R root:root /opt/hep-ro-py313
          ls -l /opt/hep-ro-py313/bin/python3.13
          sudo mkdir -p /opt/hep-ro-wrap
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$PY39" | sudo tee /opt/hep-ro-wrap/python > /dev/null
          sudo chmod 755 /opt/hep-ro-wrap/python
          "$PY313" -m venv "$RUNNER_TEMP/rw/venv"
      - name: python3 is 3.9
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Guard cases AC2-AC4 over every skill script
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          "$PY313" tools/platform_checks.py old-python --old "$(command -v python3)" --ro /opt/hep-ro-py313/bin/python3.13 \
            --wrapper /opt/hep-ro-wrap/python --writable "$RUNNER_TEMP/rw/venv/bin/python" \
            --root-prefix "sudo -n --preserve-env=HEP_RESEARCH_PYTHON" | tee "$RUNNER_TEMP/old-python.json"
      - name: The real 3.9 byte-compiles every skill script (test_python_compat)
        env:
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          "$PY313" -m unittest -v tests.tools.test_python_compat 2>&1 | tee "$RUNNER_TEMP/compat.txt"
          grep -q "test_a_real_old_python_compiles_them .* ok" "$RUNNER_TEMP/compat.txt"

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the latest releases (no lock)
        run: python -m pip install --upgrade numpy scipy matplotlib sympy hypothesis
      - name: Unit tests including the slow tier
        env:
          HEP_SLOW_TESTS: "1"
          # tests.examples.test_stats_benchmarks alone takes about 525-545 s in the slow tier, near the default 600 s
          # per-module limit; under parallel load it timed out. A larger limit, not fewer toys or looser tolerances.
          HEP_MODULE_TIMEOUT: "1800"
        run: python tools/run_all_checks.py --no-cli --jobs 4 --out ../../check-runs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: check-run-latest
          path: check-runs/
