# statistics-validation: the hep-statistics calibration campaigns and backend release gates (audit CI gates 2 and 3).
# They are too long for a pull request, so they run weekly, on demand, and on a release tag. A pull request that
# passes `tests` has NOT run these: the capability matrix says so for every result that depends on them.
#   campaigns         the stats-benchmarks example campaigns at full budget (20,000-toy coverage grid; discrete
#                     profiling study), compared with the committed outputs; MC uncertainty, seeds and failures are in
#                     each output
#   published         the open ATLAS-SUSY-2018-31 likelihood (HEPData ins1748602, checksum pinned) against the
#                     preregistered paper values (asymptotic construction); an unavailable download is not-run and
#                     fails the job, never a pass
#   combine           CMS Combine 11.1.0 (conda-forge package cms-combine) with ROOT 6.36.14 (the build recorded in VALIDATION.md):
#                     the datacard template against pyhf; Combine missing fails the job (no silent skip)
name: statistics-validation
on:
  schedule:
    - cron: "41 4 * * 3"  # Wednesdays 04:41 UTC
  workflow_dispatch:
  push:
    tags: ["hep-research--v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/hep-research

jobs:
  campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned set
        run: python -m pip install -r requirements-ci.lock
      - name: Full-budget campaigns reproduce the committed outputs
        env:
          HEP_SLOW_TESTS: "1"
        run: python -m unittest tests.examples.test_stats_benchmarks -v

  published:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned set with pyhf
        run: python -m pip install -r requirements-ci.lock "pyhf==0.7.6"
      - name: Reproduce the published model-independent limits (asymptotic, preregistered tolerances)
        run: |
          set +e
          python examples/stats-benchmarks/published-likelihood-sbottom/run.py --download "$RUNNER_TEMP/pallet" --toys 0 --out "$RUNNER_TEMP/published"
          code=$?
          if [ "$code" = 4 ]; then echo "::error::not-run: the likelihood pallet could not be downloaded or its checksum differs"; fi
          exit $code

  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
        working-directory: plugins/hep-research
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-name: combine
          create-args: >-
            python=3.13 root=6.36.14 cms-combine=11.1.0 pyhf=0.7.6 numpy scipy
          condarc: |
            channels: [conda-forge]
      - name: Combine datacard template against pyhf; Combine required
        # no pip install of the lock here: it would replace conda's NumPy under ROOT; the test needs only NumPy and SciPy
        run: python tools/run_required_backends.py --require exe:combine,pyhf==0.7.6 --modules tests.adapters.test_combine_datacard_template
