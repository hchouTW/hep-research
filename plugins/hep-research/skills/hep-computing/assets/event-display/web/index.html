<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event display</title>
    <style>
      :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #3b6ea5; --err: #b3261e; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      #status { color: var(--muted); }
      #status.failed { color: var(--err); }
      #labels { margin-left: auto; color: var(--muted); }
      main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); height: calc(100vh - 45px); }
      #eventDisplay { position: relative; min-height: 300px; }
      #panels { overflow: auto; border-left: 1px solid var(--line); padding: 8px; display: grid; gap: 8px; align-content: start; }
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .panel h2 { font-size: 13px; margin: 0 0 4px; }
      .panel .plot { height: 280px; }
      .panel .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .panel.error .note, .panel.unavailable .note { color: var(--err); }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #eventDisplay { height: 60vh; } }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Event display</h1>
      <label>Event <select id="eventSelect" aria-label="event"></select></label>
      <span id="status" role="status">loading…</span>
      <span id="labels"></span>
    </header>
    <main>
      <div id="eventDisplay"></div>
      <aside id="panels" aria-label="panels"></aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
