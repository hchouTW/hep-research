seed: 42
device: auto

data:
  train_size: 8000
  val_size: 2000
  input_dim: 32
  num_classes: 4
  batch_size: 128
  num_workers: 2

model:
  type: mlp
  hidden_dim: 128
  dropout: 0.2

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true
  output_dir: runs/example
