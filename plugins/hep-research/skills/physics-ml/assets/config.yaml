# Defaults for train_classifier.py --config config.yaml; command-line flags override these values.
seed: 42
device: auto

data:
  train_size: 8000
  val_size: 2000
  test_size: 2000
  input_dim: 32
  num_classes: 2
  batch_size: 128
  num_workers: 2

model:
  type: mlp
  hidden_dim: 128
  dropout: 0.2

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  precision: fp32
  output_dir: runs/example
